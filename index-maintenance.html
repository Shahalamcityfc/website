<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Under Maintenance | Shah Alam City FC</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <style>
        :root {
            --maroon: #800000;
            --maroon-dark: #4d0000;
            --gold: #FFA700;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 167, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 167, 0, 0.08) 0%, transparent 40%),
                linear-gradient(160deg, var(--maroon-dark) 0%, var(--maroon) 100%);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .card {
            max-width: 480px;
            width: 100%;
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--gold);
            box-shadow: 0 0 40px rgba(255, 167, 0, 0.35);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 167, 0, 0.25); }
            50% { box-shadow: 0 0 50px rgba(255, 167, 0, 0.55); }
        }

        h1 {
            margin-top: 28px;
            font-size: clamp(26px, 6vw, 40px);
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--gold);
        }

        .tagline {
            margin-top: 10px;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
        }

        p.msg {
            margin-top: 24px;
            font-size: 16px;
            line-height: 1.7;
            opacity: 0.85;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: var(--gold);
            margin: 28px auto 0;
            border-radius: 2px;
        }

        .contact {
            margin-top: 28px;
            font-size: 14px;
            opacity: 0.75;
        }

        .contact a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }

        .contact a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo.jpg" alt="Shah Alam City FC" class="logo">
        <h1>Under <span>Maintenance</span></h1>
        <div class="tagline">One City. One Pack.</div>
        <p class="msg">
            Laman web Shah Alam City FC sedang dinaik taraf.<br>
            Kami akan kembali tidak lama lagi.
        </p>
        <div class="divider"></div>
        <p class="contact">
            Sebarang pertanyaan:
            <a href="mailto:admin@shahalamcityfc.com">admin@shahalamcityfc.com</a>
        </p>
    </div>
</body>
</html>
